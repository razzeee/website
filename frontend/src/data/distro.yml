- name: Chrome OS
  displayName: ChromeOS
  logo: chrome-os.svg
  translationKey: chrome_os
  priority: 90
  introduction:
    translationKey: introduction
    text: >-
      <text>Flatpak applications can be installed on ChromeOS with the Crostini Linux compatibility layer.
      This is not available for all ChromeOS devices, so you should ensure your device is compatible before
      proceeding. A list of compatible devices is maintained <link>here</link>.</text>
    links:
      link:
        href: https://www.reddit.com/r/Crostini/wiki/getstarted/crostini-enabled-devices
  steps:
    - translationKey: step-1
      name: Enable Linux support
      text: >-
        <text>Navigate to <settingslink>chrome://os-settings</settingslink>, and scroll down to <strong>Developers</strong>
        and turn on <em>Linux development environment</em>. ChromeOS will take some time downloading and
        installing Linux.</text>
      links:
        settingslink:
          href: chrome://os-settings
          text: chrome://os-settings
    - translationKey: step-2
      name: Start a Linux terminal
      text: >-
        <text>Press the Search/Launcher key, type "Terminal", and launch the Terminal app.</text>
    - translationKey: step-3
      name: Install Flatpak
      text: >-
        <text>To install Flatpak, run the following in the terminal:</text> <code></code>
      commands:
        code: sudo apt install flatpak
    - translationKey: step-4
      name: Add the Flathub repository
      text: >-
        <text>Flathub is the best place to get Flatpak apps. To enable it, run:</text> <code></code>
      commands:
        code: flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - translationKey: step-5
      name: Restart
      text: >-
        <text>To complete setup, restart Linux. You can do this by right-clicking terminal, and then clicking
        "Shut down Linux". Now all you have to do is <link>install apps</link>!</text>
