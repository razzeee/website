- name: Ubuntu
  displayName: Ubuntu
  logo: ubuntu.svg
  translationKey: ubuntu
  priority: 100
  steps:
    - translationKey: step-1
      name: Install Flatpak
      text: >-
        <text>To install Flatpak on <strong>Ubuntu 18.10 (Cosmic Cuttlefish) or later</strong>, open the
        Terminal app and run:</text> <code></code>
      commands:
        code: sudo apt install flatpak
    - translationKey: step-2
      name: Install GNOME Software Flatpak plugin
      text: >-
        <text>The GNOME Software plugin makes it possible to install apps without needing the command line.
        To install, run:</text> <code></code> <text><strong>Note:</strong> Ubuntu distributes GNOME Software
        as a Snap in versions 20.04 to 23.04, and replaced it with App Center in 23.10 and newer—neither
        of which support installing Flatpak apps. Installing the Flatpak plugin will also install a deb
        version of GNOME Software, resulting in two "Software" apps being installed at the same time on
        Ubuntu 20.04 to 23.04, and a single new "Software" app on Ubuntu 23.10 and newer.</text>
      commands:
        code: sudo apt install gnome-software-plugin-flatpak
    - translationKey: step-3
      name: Add the Flathub repository
      text: >-
        <text>Flathub is the best place to get Flatpak apps. To enable it, download and install the <filelink>Flathub
        repository file</filelink> or run:</text> <code></code>
      commands:
        code: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - translationKey: step-4
      name: Restart
      text: >-
        <text>To complete setup, restart your system. Now all you have to do is <link>install apps</link>!</text>
- name: Fedora
  displayName: Fedora
  logo: fedora.svg
  translationKey: fedora
  priority: 85
  introduction:
    translationKey: introduction
    text: >-
      <text>Flatpak is installed by default on Fedora Workstation, Fedora Silverblue, and Fedora Kinoite.
      To get started, all you need to do is enable Flathub, which is the best way to get Flatpak apps.
      Flathub is pre-configured as a part of the <repolink>Third-Party Repositories</repolink>. Alternatively,
      you can download and install the <filelink>Flathub repository file</filelink>.</text> <text>Now
      all you have to do is <applink>install apps</applink>!</text> <text>The above links should work
      on the default GNOME and KDE Fedora installations, but if they fail for some reason you can manually
      add the Flathub remote by running:</text> <code></code>
    links:
      repolink:
        href: https://docs.fedoraproject.org/en-US/workstation-working-group/third-party-repos/
    commands:
      code: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
  steps: []
- name: Manjaro
  displayName: Manjaro
  logo: manjaro.svg
  translationKey: manjaro
  priority: 65
  steps:
    - translationKey: step-1
      name: Enable Flatpak through the Software Manager
      text: >-
        <text>Flatpak is installed by default on Manjaro 20 or higher.</text> <text>To enable its support,
        navigate to the <strong>Software Manager</strong> (Add/Remove Programs)</text> <text>Click on the
        triple line menu [or dots depending on the Desktop Environment] on the right, in the drop down menu
        select "Preferences"</text> <text>Navigate to the "Flatpak" tab and slide the toggle to Enable Flatpak
        support (it is also possible to enable checking for updates, which is recommended).</text>
    - translationKey: step-2
      name: Restart
      text: >-
        <text>To complete setup, restart your system. Now all you have to do is <link>install apps</link>!</text>
